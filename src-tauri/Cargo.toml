[package]
name = "editor-tarui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "editor_tarui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["fs"] }
base64 = "0.22"

# Image processing (pure Rust, replaces Python opencv-python)
image = "0.25"
imageproc = "0.25"

# WebSocket for Edge TTS (replaces Python edge-tts)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Audio processing (replaces Python soundfile + librosa + torch)
hound = "3"
rubato = "0.15"

# ONNX inference (replaces Python torch + modelscope + onnxruntime)
ort = { version = "2.0.0-rc.13", features = ["load-dynamic"] }
ndarray = "0.17"

# SQLite (replaces browser IndexedDB)
rusqlite = { version = "0.32", features = ["bundled"] }

